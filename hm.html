<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сучасна HTML форма</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        color: white;
      }

      body.dark {
        background: #222;
        color: white;
      }

      .form-card {
        width: 100%;
        max-width: 700px;
        background: #111827;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }

      .form-card h1 {
        margin-bottom: 10px;
        font-size: 32px;
      }

      .form-card p {
        color: #94a3b8;
        margin-bottom: 30px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .full {
        grid-column: 1 / -1;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 14px;
        color: #cbd5e1;
      }

      input,
      textarea,
      select {
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: #1e293b;
        color: white;
        outline: none;
        transition: 0.3s;
      }

      input:focus,
      textarea:focus,
      select:focus {
        box-shadow: 0 0 0 3px #3b82f6;
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      .radio-group,
      .checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 5px;
      }

      .radio-group label,
      .checkbox-group label {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #1e293b;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
      }

      .range-value {
        margin-top: 10px;
        color: #38bdf8;
        font-weight: bold;
      }

      .buttons {
        display: flex;
        gap: 15px;
        margin-top: 25px;
      }

      button {
        flex: 1;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      .submit-btn {
        background: #2563eb;
        color: white;
      }

      .submit-btn:hover {
        background: #1d4ed8;
      }

      .reset-btn {
        background: #334155;
        color: white;
      }

      .reset-btn:hover {
        background: #475569;
      }

      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .elements {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
      }
    </style>
    <script defer src="./scripts/lesson9.js"></script>
  </head>
  <body>
    <div class="elements">
        <select id="theme-select">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
        <select id="lang-select">
            <option value="en">English</option>
            <option value="ua">Українська</option>
        </select>
    </div>
    <form id="formcard">
      <h1 id="h1">Реєстраційна форма</h1>
      <p id="p">Приклад сучасної HTML форми з різними елементами</p>
        <br />
      <div class="grid">
        <div class="field">
          <label id="name">Ім'я</label>
          <input type="text" id="name_holder" name="name" placeholder="Введіть ім'я" />
        </div>

        <div class="field">
          <label id="surname">Прізвище</label>
          <input type="text" id="surname_holder" name="surname" placeholder="Введіть прізвище" />
        </div>

        <div class="field">
          <label id="email">Пошта</label>
          <input type="email" name="email" placeholder="example@gmail.com" />
        </div>

        <div class="field">
          <label id="password">Пароль</label>
          <input type="password" name="pwd" placeholder="********" />
        </div>

        <div class="field">
          <label id = "birthday">Дата народження</label>
          <input type="date" name="date" />
        </div>

        <div class="field">
          <label id = "phone">Телефон</label>
          <input type="tel" name="phone" placeholder="+380..." />
        </div>

        <div class="field full">
          <label id="country">Країна</label>
          <select name="country">
            <option id="ua" value="uk">Україна</option>
            <option id="pl">Польща</option>
            <option id="ge">Німеччина</option>
            <option id="usa">США</option>
          </select>
        </div>

        <div class="field full">
          <label id="sex">Стать</label>

          <div class="radio-group">
            <label> 
                <input type="radio" checked id="gender" name="gender" value="m" />
                <div id="male" for="gender">
                    Чоловік
                </div>
            </label>
            <label>
                <input type="radio" id="gender" name="gender" value="w" />
                <div id="female" for="gender">
                    Жінка
                </div>
            </label>
            
          </div>
        </div>

        <div class="field full">
          <label id="skills">Ваші навички</label>

          <div class="checkbox-group">
            <label>
              <input type="checkbox" checked />
              HTML
            </label>

            <label>
              <input type="checkbox" />
              CSS
            </label>

            <label>
              <input type="checkbox" />
              JavaScript
            </label>

            <label>
              <input type="checkbox" />
              Python
            </label>
          </div>
        </div>

        <div class="field full">
          <label id="skill_level">Рівень досвіду</label>

          <input
            type="range"
            min="0"
            max="100"
            value="50"
            id="range"
            name="exp"
            oninput="valueText.innerText = this.value + '%'"
          />

          <div class="range-value" id="valueText">50%</div>
        </div>

        <div class="field full">
          <label id="file">Завантажити файл</label>
          <input type="file" />
        </div>

        <div class="field full">
          <label id="comm">Коментар</label>
          <textarea type="text" id="comm_holder" placeholder="Напишіть щось..."></textarea>
        </div>

        <div class="field full">
            <label>
                <input type="checkbox" id="agree-box" name="agree" />
                <div id="agree">
                    Я погоджуюсь з умовами
                </div>
            </label>
        </div>
      </div>
      <div class="buttons">
        <button id="submit" type="submit" class="submit-btn">Відправити</button>
        <button id="reset" type="reset" class="reset-btn">Очистити</button>
      </div>
    </form>
    <script type="module" src="./scripts/hm.js"></script>
  </body>
</html>
