<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MealDB</title>
        <link rel="stylesheet" href="./style/index.css">
    </head>
    <body>
        
        <!-- Header -->
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">
                    🍽 Meal Explorer
                </a>
                <form class="d-flex" id="search-form">
                    <input
                        id="search-input"
                        class="form-control me-2"
                        type="search"
                        placeholder="Пошук страви"
                    >
                    <button
                        class="btn btn-warning"
                        type="submit"
                    >
                        Знайти
                    </button>
                    <button
                        class="random-btn" id="randomMealBtn">
                        🎲
                    </button>
                </form>
            </div>
        </nav>
        <!-- Hero -->
        <section class="bg-light py-5">
            <div class="container text-center">
                <h1>Каталог рецептів</h1>
                <p class="lead">
                    Знайди улюблену страву та переглянь рецепт
                </p>
            </div>
        </section>
        <!-- Categories -->
        <section class="container py-5">
            <div id="meals-container"></div>
            <h2 class="mb-4">Категорії</h2>
            <div class="row g-3">
                <div class="col-md-3">
                    <button class="btn btn-outline-primary w-100" data-action="Beef">
                        Beef
                    </button>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-outline-primary w-100" data-action="Chicken">
                        Chicken
                    </button>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-outline-primary w-100" data-action="Dessert">
                        Dessert
                    </button>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-outline-primary w-100" data-action="Seafood">
                        Seafood
                    </button>
                </div>
            </div>
        </section>
        <!-- Meals -->
        <section class="container pb-5">
            <h2 class="mb-4">Популярні страви</h2>
            <div id="top-meals-container"></div>
        </section>
        </div>
        <div id="modalOverlay" class="modal-overlay hidden">
            <div class="modal">
                <button class="close-btn" id="closeModalBtn">✕</button>
                <div id="modalContent" class="modal-content"></div>
            </div>
        </div>
        <script type="module" src="./dist/main.js"></script>
    </body>
</html>
