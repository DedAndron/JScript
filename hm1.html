<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 700px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0b5ed7;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th {
            background: #0d6efd;
            color: white;
            padding: 12px;
        }
        td {
            width: 14.2%;
            height: 80px;
            border: 1px solid #ddd;
            font-size: 18px;
        }
        td:hover {

            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            Calendar
        </h1>
        <div class="controls">
            <input
                type="number"
                id="month"
                placeholder="Month (1-12)"
                min="1"
                max="12"
            >
            <input
                type="number"
                id="year"
                placeholder="Year"
            >
            <button id="generate-btn">
                Create
            </button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                    <th>Sat</th>
                    <th>Sun</th>
                </tr>
            </thead>
            <tbody id="calendar-body">
            </tbody>
        </table>
    </div>
    <script>
        const button = document.getElementById("generate-btn");
        const calendarBody = document.getElementById("calendar-body");
        button.addEventListener("click", () => {
            const month = Number(document.getElementById("month").value);
            const year = Number(document.getElementById("year").value);
            if (month < 1 || month > 12 || !year) {
                alert("Enter correct data");
                return;
            }
            generateCalendar(month, year);
        });
        function generateCalendar(month, year) {
            calendarBody.innerHTML = "";
            // Перший день місяця
            const firstDay = new Date(year, month - 1, 1);
            // Останній день місяця
            const lastDay = new Date(year, month, 0).getDate();
            // День тижня
            let startDay = firstDay.getDay();
            // Робимо понеділок першим днем
            if (startDay === 0) {
                startDay = 7;
            }
            let date = 1;
            for (let i = 0; i < 6; i++) {
                const row = document.createElement("tr");
                for (let j = 1; j <= 7; j++) {
                    const cell = document.createElement("td");
                    if (i === 0 && j < startDay) {
                        cell.textContent = "";
                    } else if (date > lastDay) {
                        cell.textContent = "";
                    } else {
                        cell.textContent = date;
                        date++;
                    }
                    row.appendChild(cell);
                }
                calendarBody.appendChild(row);
                if (date > lastDay) {
                    break;
                }
            }
        }
    </script>
</body>
</html>
